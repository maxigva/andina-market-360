<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andina Market 360 - Tablero de ventas por sede</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; max-width: 640px; margin: 40px auto; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
  th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; }
  td.n { text-align: right; }
  .fila { display: flex; align-items: center; margin: 4px 0; }
  .etq { width: 90px; }
  .barra { background: #1f5f99; color: #fff; padding: 3px 6px; white-space: nowrap; }
</style>
</head>
<body>
<h1>Andina Market 360 · Tablero de ventas por sede</h1>
<p id="presentacion"></p>
<p>Resumen generado por <code>src/resumen.py</code> a partir de <code>data/ventas.csv</code> (datos ficticios).</p>
<div id="contenido">Cargando...</div>
<script>
function tabla(titulo, datos, total) {
  let filas = Object.entries(datos).map(([k, v]) => `<tr><td>${k}</td><td class="n">S/ ${v.toFixed(2)}</td></tr>`).join("");
  if (total !== undefined) filas += `<tr><th>TOTAL</th><th class="n">S/ ${total.toFixed(2)}</th></tr>`;
  return `<h2>${titulo}</h2><table><tr><th>${titulo.split(" ").pop()}</th><th>Ventas</th></tr>${filas}</table>`;
}
function grafico(datos) {
  const max = Math.max(...Object.values(datos));
  const barras = Object.entries(datos).map(([k, v]) =>
    `<div class="fila"><span class="etq">${k}</span><div class="barra" style="width:${(v / max * 100).toFixed(1)}%">S/ ${v.toFixed(2)}</div></div>`).join("");
  return `<h2>Comparativo</h2>${barras}<p>Lima lidera con S/ 814.00.</p>`;
}
fetch("data/resumen.json")
  .then(r => r.json())
  .then(d => {
    const sedes = Object.keys(d.por_sede);
    const meses = Object.keys(d.por_mes).sort();
    document.getElementById("presentacion").innerHTML =
      `<b>Sedes:</b> ${sedes.slice(0, -1).join(", ")} y ${sedes.at(-1)} · ` +
      `<b>Período:</b> ${meses[0]} a ${meses.at(-1)} · ` +
      `<b>Origen:</b> datos ficticios de <code>data/ventas.csv</code>`;
    document.getElementById("contenido").innerHTML =
      `<p><b>Operaciones:</b> ${d.operaciones}</p>` +
      grafico(d.por_sede) +
      tabla("Ventas por sede", d.por_sede, d.total) +
      tabla("Ventas por producto", d.por_producto) +
      tabla("Ventas por mes", d.por_mes);
  })
  .catch(() => {
    document.getElementById("contenido").textContent =
      "No se encontró data/resumen.json. Ejecute: python src/resumen.py --json docs/data/resumen.json";
  });
</script>
</body>
</html>
